<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050912">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cadence">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Cadence</title>
<style>
:root{--bg:#050912;--panel:#09111f;--raise:#0e1a30;--line:#15213a;--text:#e8efff;--mute:#7c8cae;--accent:#5ea4ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.4 Inter,"Segoe UI",system-ui,-apple-system,sans-serif;display:grid;grid-template-columns:232px 1fr;grid-template-rows:minmax(0,1fr) 88px;grid-template-areas:"side main" "bar bar";overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.fl{fill:currentColor;stroke:none}
aside{grid-area:side;padding:20px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto;border-right:1px solid var(--line)}
.brand{font-weight:700;font-size:19px;letter-spacing:-.02em;padding:4px 12px 18px}
.nav{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:var(--mute);width:100%;text-align:left;white-space:nowrap}
.nav span{overflow:hidden;text-overflow:ellipsis}
.nav:hover{color:var(--text);background:var(--panel)}
.nav.on{color:var(--text);background:var(--raise)}
.sec{display:flex;justify-content:space-between;align-items:center;padding:20px 12px 6px;color:var(--mute);font-size:12px}
.ib{color:var(--mute);display:grid;place-items:center;width:28px;height:28px;border-radius:50%}
.ib:hover{color:var(--text);background:var(--panel)}
main{grid-area:main;overflow:auto;padding:0 32px 32px;min-width:0}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,transparent);padding:24px 0 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.meta{color:var(--mute);font-size:13px;width:100%;margin-top:-6px}
.sp{flex:1}
input.s,select,.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 14px;font:inherit;outline:none}
input.s{width:200px}
input.s:focus,select:focus{border-color:var(--accent)}
.btn:hover{background:var(--raise)}
.btn.pri{background:var(--accent);color:#0b0d10;border-color:transparent;font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
[hidden]{display:none!important}
.row{display:grid;grid-template-columns:40px minmax(0,3fr) minmax(0,2fr) 56px 76px;gap:12px;align-items:center;padding:6px 8px;border-radius:8px;cursor:default;user-select:none}
.row:hover{background:var(--panel)}
.tt{display:flex;gap:12px;align-items:center;min-width:0}
.tt>div:last-child{min-width:0}
.cov{width:40px;height:40px;border-radius:6px;background:var(--raise) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--mute)}
.tt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt span,.al,.du,.card span{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.du{text-align:right;font-variant-numeric:tabular-nums}
.row.on b{color:var(--accent)}
.idx{display:grid;place-items:center;color:var(--mute);font-variant-numeric:tabular-nums;height:28px}
.idx .eq,.idx .pl{display:none}
.row.on .idx .n{display:none}
.row.on .idx .eq{display:flex}
.row:hover .idx .n,.row:hover .idx .eq{display:none}
.row:hover .idx .pl{display:block;color:var(--text)}
.eq{gap:2px;align-items:flex-end;height:14px}
.ac{display:flex;justify-content:flex-end;gap:4px}
.ac button{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--mute);opacity:0}
.row:hover .ac button,.ac button:focus-visible,.ac .f{opacity:1}
.ac button:hover{color:var(--text)}
.hb.f,.ac .f{color:var(--accent)}
.hb.f svg,.ac .f svg{fill:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{text-align:left;padding:10px;border-radius:12px;min-width:0}
.card:hover{background:var(--panel)}
.card .cov{width:100%;height:auto;aspect-ratio:1;border-radius:8px;margin-bottom:10px}
.card .cov svg{width:34px;height:34px}
.card.art .cov{border-radius:50%}
.card b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;color:var(--mute);padding:12vh 0}
.empty h2{color:var(--text);font-size:20px;font-weight:600}
footer{grid-area:bar;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr minmax(320px,560px) 1fr;align-items:center;gap:16px;padding:0 20px;min-width:0}
.now{display:flex;gap:12px;align-items:center;min-width:0}
.now .cov{width:56px;height:56px;border-radius:8px}
.nt{min-width:0}
.nt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt span{color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ctr{display:flex;flex-direction:column;gap:8px;align-items:center;min-width:0}
.btns{display:flex;gap:20px;align-items:center}
.btns button{color:var(--mute);position:relative}
.btns button:hover,.btns .tg.on{color:var(--text)}
.btns .tg.on{color:var(--accent)}
.btns .play{width:38px;height:38px;border-radius:50%;background:var(--text);color:#0b0d10;display:grid;place-items:center}
.btns .play:hover{color:#0b0d10;transform:scale(1.05)}
#rep[data-m="2"]::after,#nrep[data-m="2"]::after{content:"1";position:absolute;right:-3px;top:-3px;font-size:9px;font-weight:700;background:var(--accent);color:#0b0d10;border-radius:50%;width:12px;height:12px;display:grid;place-items:center;line-height:1}
.seekrow{display:flex;gap:10px;align-items:center;width:100%;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.seekrow span{width:36px}
.seekrow span:last-child{text-align:left}
.seekrow span:first-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(to right,var(--fill,var(--text)) var(--p,0%),var(--line) var(--p,0%));flex:1;outline:none;cursor:pointer;min-width:0}
.seekrow:hover input,.vol:hover input{--fill:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--text);opacity:0}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--text);opacity:0}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{opacity:1}
input[type=range]:hover::-moz-range-thumb,input[type=range]:focus-visible::-moz-range-thumb{opacity:1}
.vol{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.vol button{color:var(--mute)}
.vol button:hover{color:var(--text)}
.vol input{flex:none;width:110px}
#menu{position:fixed;display:none;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:210px;max-width:280px;max-height:60vh;overflow:auto;z-index:50;box-shadow:0 14px 36px rgba(0,0,0,.55)}
#menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu button:hover{background:var(--line)}
#menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
#toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--text);color:#0b0d10;padding:9px 16px;border-radius:999px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
#toast.on{opacity:1}
body.drag::after{content:"Drop music to add it to your library";position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:16px;background:rgba(14,15,17,.88);display:grid;place-items:center;font-size:20px;font-weight:600;z-index:80}
@media (max-width:820px){
 body{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 124px auto;grid-template-areas:"main" "bar" "side"}
 aside{flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);overflow-x:auto;align-items:center;gap:4px;background:var(--bg)}
 .brand,.sec span{display:none}
 .sec{padding:0}
 #lists{display:flex}
 .nav{width:auto;flex-direction:column;gap:3px;padding:6px 14px;font-size:11px;max-width:96px}
 #toast{bottom:210px}
 main{padding:0 14px 20px}
 .row{grid-template-columns:36px minmax(0,1fr) 46px 64px}
 .al{display:none}
 .ac button{opacity:1}
 footer{grid-template-columns:1fr;gap:6px;padding:8px 14px}
 .vol{display:none}
 .now .cov{width:40px;height:40px}
 input.s{width:100%;order:5}
}
.now{cursor:pointer}
#np{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
#np.open{display:flex}
#np::before{content:"";position:absolute;inset:0;background:radial-gradient(110% 60% at 50% 0%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 70%);pointer-events:none}
.np-top{position:relative;display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
.seg{display:flex;gap:4px;background:var(--panel);border-radius:999px;padding:3px}
.seg button{padding:6px 16px;border-radius:999px;color:var(--mute)}
.seg .on{background:var(--raise);color:var(--text)}
.seg [data-t=player]{display:none}
.np-body{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:56px;padding:8px 48px 32px;max-width:1120px;margin:0 auto;width:100%}
.np-left{display:flex;flex-direction:column;gap:18px;justify-content:center;min-width:0}
.np-art{width:min(100%,max(160px,calc(100vh - 400px)));margin:0 auto;aspect-ratio:1;border-radius:14px;background:var(--raise) center/cover no-repeat;display:grid;place-items:center;color:var(--mute);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.np-art svg{width:72px;height:72px}
.np-meta{display:flex;align-items:center;gap:12px}
.np-meta .nt{flex:1}
.np-meta .nt b{font-size:22px;font-weight:700}
.np-left .btns{justify-content:center;gap:28px}
.nvol{display:flex;gap:10px;align-items:center}
.nvol button{color:var(--mute)}
.nvol input{flex:1}
.np-right{position:relative;min-height:0}
.pane{position:absolute;inset:0;overflow:auto;display:none;padding:8px 0 45vh;scrollbar-width:none}
.pane::-webkit-scrollbar{display:none}
#np:not([data-tab=queue]):not([data-tab=audio]) #lyr,#np[data-tab=queue] #que,#np[data-tab=audio] #amp{display:block}
#lyr p.l{font-size:clamp(22px,3vw,34px);font-weight:700;line-height:1.25;margin:0 0 20px;opacity:.4;cursor:pointer;transition:opacity .25s}
#lyr p.l.on{opacity:1}
#lyr.plain p.l{font-size:18px;font-weight:500;line-height:1.5;margin:0 0 6px;opacity:.85;cursor:default}
.lyempty{display:flex;flex-direction:column;gap:10px;color:var(--mute);padding:10vh 0}
.lyempty b{color:var(--text);font-size:20px}
.lyact{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
#lyr textarea{width:100%;height:55vh;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:14px;font:inherit;resize:none;outline:none}
.qh{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;padding:16px 8px 6px}
.qh button{color:var(--text)}
.qrow{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:8px;cursor:pointer}
.qrow:hover{background:var(--panel)}
.qrow.on .nt b{color:var(--accent)}
@media (max-width:820px){
 .seg [data-t=player]{display:block}
 .np-body{display:flex;flex-direction:column;gap:16px;padding:0 22px calc(20px + env(safe-area-inset-bottom,0px))}
 .np-left{flex:1;justify-content:space-evenly}
 .np-art{width:min(100%,50vh)}
 #np:not([data-tab=player]) .np-left{display:none}
 #np[data-tab=player] .np-right{display:none}
 .np-right{flex:1}
 .nvol{display:none}
}

body{background:var(--bg)}
aside{background:#060c18}
main{background:radial-gradient(900px 420px at 75% -12%,rgba(94,164,255,.09),transparent)}
#navset{margin-top:auto}
.shelf{margin-bottom:30px}
.shelf h2,.set h2{font-size:18px;font-weight:650;letter-spacing:-.01em;margin:0 0 12px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(138px,158px);gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -10px;padding:0 10px 4px}
.rail::-webkit-scrollbar{display:none}
.set{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;max-width:900px}
.set p{color:var(--mute);margin:8px 0 14px;line-height:1.55}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:20px}
.tile{background:var(--raise);border-radius:12px;padding:14px}
.tile b{display:block;font-size:22px;letter-spacing:-.02em}
.tile span,.mu{color:var(--mute);font-size:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.cols h3{font-size:13px;color:var(--mute);font-weight:500;margin:0 0 8px}
.st{display:grid;grid-template-columns:18px 1fr 34px;gap:8px;align-items:center;position:relative;padding:6px 0 7px;font-size:13px}
.st span{color:var(--mute)}
.st b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st em{font-style:normal;color:var(--mute);text-align:right}
.st i{position:absolute;left:26px;bottom:2px;height:2px;border-radius:2px;background:var(--accent);opacity:.7;width:calc((100% - 70px)*var(--w)/100);transform-origin:left;animation:grow .6s ease both}
.hrs{display:flex;align-items:flex-end;gap:3px;height:72px}
.hrs i{flex:1;height:max(3px,calc(var(--h)*1%));background:var(--accent);opacity:.75;border-radius:3px 3px 0 0;transform-origin:bottom;animation:growy .6s ease both}
.sw{display:flex;align-items:center;gap:12px;cursor:pointer}
.sw input{display:none}
.sw span{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--text);transition:transform .2s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(18px)}
.ac .btn{opacity:1;width:auto;height:auto;padding:4px 14px;border-radius:999px;color:var(--text)}
.modal{position:fixed;inset:0;background:rgba(2,5,12,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;z-index:70;opacity:0;pointer-events:none;transition:opacity .25s}
.modal.open{opacity:1;pointer-events:auto}
.modal>div{background:var(--raise);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:380px;margin:16px;transform:translateY(10px) scale(.98);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.modal.open>div{transform:none}
.modal b{font-size:18px}
.modal p{color:var(--mute);margin:8px 0 4px;line-height:1.55}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
@keyframes sheet{from{opacity:0;transform:translateY(24px)}}
#body.in{animation:rise .35s cubic-bezier(.2,.8,.2,1)}
#np.open{animation:sheet .3s cubic-bezier(.2,.8,.2,1)}
#menu{animation:pop .14s ease}
button,.row,.card,.qrow,.nav{transition:background .18s,color .18s,transform .15s,opacity .18s,border-color .18s,filter .18s}
button:active{transform:scale(.95)}
.card:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.amr{display:grid;grid-template-columns:150px 1fr 70px;gap:12px;align-items:center;margin:8px 0}.amr span{color:var(--mute)}.amr em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}.amr input{accent-color:var(--accent);width:100%}@media(max-width:560px){.amr{grid-template-columns:1fr 60px}.amr span{grid-column:1/3}}
.brand small{font-weight:400;font-size:11px;color:var(--mute);margin-left:4px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--line)}.kv span{color:var(--mute)}.kv b{font-weight:500;text-align:right}
@keyframes breathe{50%{transform:scale(1.06)}}
@keyframes glow{0%,100%{box-shadow:0 24px 60px -18px rgba(0,0,0,.6)}50%{box-shadow:0 24px 80px -8px var(--accent)}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes heart{0%{transform:scale(.5)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes drift{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.08)}}
@keyframes bar{0%{height:20%}100%{height:100%}}
@keyframes slidein{from{opacity:0;transform:translateX(-10px)}}
#body.in .row{animation:slidein .4s cubic-bezier(.2,.8,.2,1) backwards}
#body.in .card{animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards}
.card:hover{transform:translateY(-4px)}
.card .cov{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}.card:hover .cov{transform:scale(1.03);box-shadow:0 10px 26px -10px var(--accent)}
.btn:active,.btns button:active,.ib:active,.ac button:active{transform:scale(.9)}
.nav{position:relative}.nav.on::before{content:"";position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:2px;background:var(--accent);animation:growy .25s ease both}
#nfav.f svg,#npfav.f svg{animation:heart .45s cubic-bezier(.2,1.6,.4,1)}
#toast{transform:translate(-50%,14px) scale(.96);transition:opacity .22s,transform .25s cubic-bezier(.2,.8,.2,1)}#toast.on{transform:translate(-50%,0) scale(1)}
#seek::-webkit-slider-thumb,#nseek::-webkit-slider-thumb{transition:transform .15s}#seek:active::-webkit-slider-thumb,#nseek:active::-webkit-slider-thumb{transform:scale(1.3)}
#body.in .set{animation:rise .4s cubic-bezier(.2,.8,.2,1) backwards}
#seek,#nseek{height:24px;padding:9px 0;background-clip:content-box;touch-action:pan-y}
#seek::-webkit-slider-thumb,#nseek::-webkit-slider-thumb{width:14px;height:14px;margin-top:-4px}
#seek::-webkit-slider-runnable-track,#nseek::-webkit-slider-runnable-track{height:6px;background:transparent}
@media (hover:none){#seek::-webkit-slider-thumb,#nseek::-webkit-slider-thumb{opacity:1;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}#seek::-moz-range-thumb,#nseek::-moz-range-thumb{opacity:1}}
.spf{width:100%;border:0;border-radius:12px;display:block;background:var(--raise)}
.sprow{display:flex;gap:8px;flex-wrap:wrap}.sprow input.s{flex:1;min-width:220px;width:auto}
.lyact a.btn{text-decoration:none;display:inline-block}
.sprec{flex:1;text-align:left;display:flex;justify-content:space-between;gap:12px;min-width:0}.sprec span{color:var(--mute);text-transform:capitalize}

/* ---------- level dots + motion ---------- */
.eq i{width:3px;height:30%;background:var(--accent);border-radius:2px;transition:height .1s linear}
.viz{display:flex;gap:3px;align-items:center;height:18px;flex:none;margin-left:6px}
.viz i{width:4px;height:4px;border-radius:3px;background:var(--accent);transition:height .09s linear}
@keyframes fadein{from{opacity:0}}
.swap{animation:fadein .45s ease}
.swapt{animation:slidein .35s cubic-bezier(.2,.8,.2,1)}
h1.swapt{animation:rise .35s cubic-bezier(.2,.8,.2,1)}
#body.in .row{animation:slidein .4s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(min(var(--i,0),16)*28ms)}
#body.in .card,#body.in .set,#body.in .shelf{animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(min(var(--i,0),10)*55ms)}
.tile{animation:pop .4s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(min(var(--i,0),10)*50ms)}
.empty{animation:rise .5s cubic-bezier(.2,.8,.2,1)}
.pane{animation:rise .35s cubic-bezier(.2,.8,.2,1)}

<script>
(async()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const hm=s=>{const m=Math.round(s/60);return m>=60?Math.floor(m/60)+' hr '+(m%60)+' min':m+' min'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const retrig=(el,c)=>{el.classList.remove(c);void el.offsetWidth;el.classList.add(c)};
const setH=(el,h)=>{if(el._h!==h){el._h=h;el.innerHTML=h}};
const cmp=(a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'});
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem('cadence.'+k));localStorage.setItem('cadence.'+k,JSON.stringify(v))}catch{return null}};

const FILL={play:'M8 5v14l11-7z',pause:'M6 5h4v14H6zM14 5h4v14h-4z',next:'M6 6l9 6-9 6zM17 6h2v12h-2z',prev:'M18 6l-9 6 9 6zM5 6h2v12H5z'};
const LINE={shuffle:'M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5',repeat:'M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3',heart:'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z',more:'M5 12h.01M12 12h.01M19 12h.01',plus:'M12 5v14M5 12h14',vol:'M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14',mute:'M11 5 6 9H2v6h4l5 4zM22 9l-6 6M16 9l6 6',note:'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z',disc:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',user:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',x:'M18 6 6 18M6 6l12 12',down:'M6 9l6 6 6-6',home:'M3 11l9-8 9 8M5 10v10h14V10',sliders:'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6',globe:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20'};
const ic=n=>FILL[n]?`<svg class="fl" viewBox="0 0 24 24"><path d="${FILL[n]}"/></svg>`:`<svg viewBox="0 0 24 24"${n==='more'?' style="stroke-width:3"':''}><path d="${LINE[n]}"/></svg>`;
const setIcons=()=>document.querySelectorAll('[data-ic]').forEach(e=>{e.innerHTML=ic(e.dataset.ic)});
setIcons();

const db=await new Promise((res,rej)=>{const r=indexedDB.open('cadence',2);r.onupgradeneeded=()=>{const d=r.result;[['tracks',{keyPath:'id'}],['blobs'],['lists',{keyPath:'id'}],['art']].forEach(([n,o])=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,o)})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const st=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const put=(s,v,k)=>{if(s==='tracks'&&'cover' in v){const{cover,...r}=v;v=r}return req(st(s,'readwrite').put(v,k))};
const del=(s,k)=>req(st(s,'readwrite').delete(k));
try{navigator.storage?.persist?.()}catch{}

let tracks=new Map(),lists=[];
const load=async()=>{
 const rows=await req(st('tracks').getAll()),art=new Map();
 await new Promise(res=>{const c=st('art').openCursor();c.onsuccess=()=>{const x=c.result;if(!x)return res();art.set(x.key,new Blob([x.value.buf],{type:x.value.type||'image/jpeg'}));x.continue()};c.onerror=()=>res()});
 for(const t of rows){
  if(!art.has(t.id)&&t.cover instanceof Blob){try{const b=await t.cover.arrayBuffer();if(b.byteLength>100){const ty=t.cover.type||'image/jpeg';await put('art',{buf:b,type:ty},t.id);art.set(t.id,new Blob([b],{type:ty}))}}catch{}}
  t.cover=art.get(t.id)||null;
 }
 tracks=new Map(rows.map(t=>[t.id,t]));
 lists=(await req(st('lists').getAll())).sort((a,b)=>a.created-b.created);
};
await load();

const dec=(b,enc)=>{if(enc===1){let le=true;if(b[0]===0xFE&&b[1]===0xFF){le=false;b=b.subarray(2)}else if(b[0]===0xFF&&b[1]===0xFE)b=b.subarray(2);return new TextDecoder(le?'utf-16le':'utf-16be').decode(b)}return new TextDecoder(enc===0?'iso-8859-1':enc===2?'utf-16be':'utf-8').decode(b)};
const txt=b=>dec(b.subarray(1),b[0]).split('\0').map(s=>s.trim()).filter(Boolean).join(', ');
const sync=(b,o=0)=>(b[o]<<21)|(b[o+1]<<14)|(b[o+2]<<7)|b[o+3];
function pic(b,v2){const enc=b[0];let p=1;if(v2)p=4;else{let e=p;while(e<b.length&&b[e]!==0)e++;p=e+1}p++;if(enc===1||enc===2){while(p+1<b.length&&!(b[p]===0&&b[p+1]===0))p+=2;p+=2}else{while(p<b.length&&b[p]!==0)p++;p++}const d=b.subarray(p);if(d.length<100)return null;return new Blob([d],{type:d[0]===0x89?'image/png':'image/jpeg'})}
const skipz=(b,p,e)=>{if(e===1||e===2){while(p+1<b.length&&!(b[p]===0&&b[p+1]===0))p+=2;return p+2}while(p<b.length&&b[p]!==0)p++;return p+1};
const uslt=b=>{const e=b[0];return dec(b.subarray(skipz(b,4,e)),e).replace(/\0+$/,'').trim()};
function sylt(b){
 const e=b[0];if(b[4]!==2)return'';
 const w=(e===1||e===2)?2:1,out=[];let p=skipz(b,6,e);
 while(p<b.length){
  let s=p;
  if(w===2){while(s+1<b.length&&!(b[s]===0&&b[s+1]===0))s+=2}else{while(s<b.length&&b[s]!==0)s++}
  const x=dec(b.subarray(p,s),e).replace(/^\n/,'').trim();p=s+w;
  if(p+4>b.length)break;
  const ms=((b[p]<<24)|(b[p+1]<<16)|(b[p+2]<<8)|b[p+3])>>>0;p+=4;
  if(x)out.push(`[${Math.floor(ms/60000)}:${((ms%60000)/1000).toFixed(2).padStart(5,'0')}]${x}`);
 }
 return out.join('\n');
}
const GEN=["Blues","Classic Rock","Country","Dance","Disco","Funk","Grunge","Hip-Hop","Jazz","Metal","New Age","Oldies","Other","Pop","R&B","Rap","Reggae","Rock","Techno","Industrial","Alternative","Ska","Death Metal","Pranks","Soundtrack","Euro-Techno","Ambient","Trip-Hop","Vocal","Jazz+Funk","Fusion","Trance","Classical","Instrumental","Acid","House","Game","Sound Clip","Gospel","Noise","Alt. Rock","Bass","Soul","Punk","Space","Meditative","Instrumental Pop","Instrumental Rock","Ethnic","Gothic","Darkwave","Techno-Industrial","Electronic","Pop-Folk","Eurodance","Dream","Southern Rock","Comedy","Cult","Gangsta","Top 40","Christian Rap","Pop/Funk","Jungle","Native American","Cabaret","New Wave","Psychedelic","Rave","Showtunes","Trailer","Lo-Fi","Tribal","Acid Punk","Acid Jazz","Polka","Retro","Musical","Rock & Roll","Hard Rock"];
const gen=g=>g.replace(/\((\d+)\)/g,(m,n)=>GEN[+n]||'').replace(/^\d+$/,n=>GEN[+n]||'').trim();
async function readTags(f){
 const t={},h=new Uint8Array(await f.slice(0,10).arrayBuffer());
 if(h[0]===0x49&&h[1]===0x44&&h[2]===0x33){
  const v=h[3],size=sync(h,6),b=new Uint8Array(await f.slice(10,10+size).arrayBuffer());
  let p=0;
  if(h[5]&0x40&&v>=3)p=v===4?sync(b,0):(((b[0]<<24)|(b[1]<<16)|(b[2]<<8)|b[3])+4);
  const il=v===2?3:4,hl=v===2?6:10;
  while(p+hl<=b.length){
   const id=String.fromCharCode(...b.subarray(p,p+il));
   if(!/^[A-Z0-9]+$/.test(id))break;
   const s=b.subarray(p+il,p+il+(v===2?3:4));
   const fs=v===2?((s[0]<<16)|(s[1]<<8)|s[2]):v===4?sync(s,0):(((s[0]<<24)|(s[1]<<16)|(s[2]<<8)|s[3])>>>0);
   const body=b.subarray(p+hl,p+hl+fs);p+=hl+fs;
   if(!body.length)continue;
   if(id==='TIT2'||id==='TT2')t.title=txt(body);
   else if(id==='TPE1'||id==='TP1')t.artist=txt(body);
   else if(id==='TALB'||id==='TAL')t.album=txt(body);
   else if(id==='TRCK'||id==='TRK')t.trk=parseInt(txt(body))||0;
   else if((id==='APIC'||id==='PIC')&&!t.cover)t.cover=pic(body,v===2);
   else if(id==='USLT'||id==='ULT')t.lyrics=t.lyrics||uslt(body);
   else if(id==='SYLT'||id==='SLT')t.sylt=t.sylt||sylt(body);
   else if(id==='TCON'||id==='TCO')t.genre=gen(txt(body));
  }
 }
 if(!t.title&&f.size>128){
  const b=new Uint8Array(await f.slice(f.size-128).arrayBuffer());
  if(b[0]===0x54&&b[1]===0x41&&b[2]===0x47){const r=(a,z)=>new TextDecoder('iso-8859-1').decode(b.subarray(a,z)).replace(/\0.*$/,'').trim();t.title=r(3,33);t.artist=r(33,63);t.album=r(63,93)}
 }
 return t;
}
const MIME={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',flac:'audio/flac',wav:'audio/wav',ogg:'audio/ogg',opus:'audio/ogg'};
const typed=(b,name)=>new Blob([b],{type:MIME[(name.split('.').pop()||'').toLowerCase()]||'audio/mpeg'});
const dur=f=>new Promise(r=>{const a=new Audio(),u=URL.createObjectURL(f);a.preload='metadata';a.onloadedmetadata=()=>{r(a.duration||0);URL.revokeObjectURL(u)};a.onerror=()=>{r(0);URL.revokeObjectURL(u)};a.src=u});

const toast=(m)=>{const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)};

async function addFiles(input){
 const lrcs=[...input].filter(f=>f&&/\.lrc$/i.test(f.name));
 const imgs=[...input].filter(f=>f&&/^(cover|folder|front|album|artwork)\.(jpe?g|png|webp)$/i.test(f.name));
 let files=[...input].filter(f=>f&&(/^audio\//.test(f.type)||/\.(mp3|m4a|aac|flac|wav|ogg|opus)$/i.test(f.name)));
 if(!files.length&&!lrcs.length)return toast('No audio files found');
 const have=new Set([...tracks.values()].map(t=>t.key));
 let n=0,i=0,fail=0;const added=[];
 for(const f of files){
  i++;
  const key=f.name+'|'+f.size;
  if(have.has(key))continue;
  toast(`Adding ${i} of ${files.length}`);
  try{
   const buf=await f.arrayBuffer();
   if(!buf.byteLength){fail++;continue}
   const fb=typed(buf,f.name);
   const d=await dur(fb);
   if(!d){fail++;continue}
   const g=await readTags(f).catch(()=>({}));
   let title=g.title,artist=g.artist;
   const base=f.name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
   if(!title){const m=base.match(/^(.+?)\s+-\s+(.+)$/);if(m){artist=artist||m[1];title=m[2]}else title=base}
   const t={id:uid(),key,title,artist:artist||'Unknown artist',album:g.album||'Unknown album',trk:g.trk||0,dur:d,cover:g.cover||null,lyrics:g.sylt||g.lyrics||'',genre:g.genre||'',scan:1,plays:0,ms:0,last:0,fav:false,added:Date.now()+i};
   await put('blobs',buf,t.id);await put('tracks',t);
   if(g.cover)await put('art',{buf:await g.cover.arrayBuffer(),type:g.cover.type},t.id);
   tracks.set(t.id,t);have.add(key);added.push([t,dirOf(f)]);n++;
  }catch(e){toast('Storage is full or unavailable');break}
 }
 toast(n?`Added ${n} song${n>1?'s':''}${fail?` (${fail} couldn’t be read)`:''}`:fail?`${fail} file${fail>1?'s':''} couldn’t be read by this browser`:'Already in your library');
 await attachLrc(lrcs);await attachArt(imgs,added);render();
}
const dirOf=f=>f.cdir||(f.webkitRelativePath||'').replace(/[^/]*$/,'');
async function applyCover(t,buf,type){
 if(covers.has(t.id)){URL.revokeObjectURL(covers.get(t.id));covers.delete(t.id)}
 await put('art',{buf,type},t.id);
 t.cover=new Blob([buf],{type});
}
async function attachArt(imgs,added){
 for(const f of imgs){
  const d=dirOf(f),buf=await f.arrayBuffer(),type=f.type||'image/jpeg';
  for(const [t,td] of added)if(td===d&&!t.cover)await applyCover(t,buf,type);
 }
}
async function attachLrc(a){
 let c=0;
 for(const f of a){const b=f.name.replace(/\.[^.]+$/,'').toLowerCase();for(const t of tracks.values()){if(t.key.split('|')[0].replace(/\.[^.]+$/,'').toLowerCase()===b){t.lyrics=(await f.text()).trim();await put('tracks',t);c++;break}}}
 if(c)toast(`Added lyrics to ${c} song${c>1?'s':''}`);
}
async function walk(en,out){
 if(en.isFile){const f=await new Promise(r=>en.file(r,()=>r(null)));if(f){f.cdir=en.fullPath.replace(/[^/]*$/,'');out.push(f)}}
 else if(en.isDirectory){const rd=en.createReader();let b;do{b=await new Promise(r=>rd.readEntries(r,()=>r([])));for(const c of b)await walk(c,out)}while(b.length)}

  const d=x.getImageData(0,0,8,8).data;let r=0,g=0,b=0;

  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;
  if(mx!==mn){const dd=mx-mn;s=dd/(1-Math.abs(mx+mn-1));h=mx===r?((g-b)/dd)%6:mx===g?(b-r)/dd+2:(r-g)/dd+4;h=Math.round(h*60);if(h<0)h+=360}

 };
 img.src=coverUrl(t);
}

function parseLrc(s){

 if(!out.length)return{sync:false,lines:s.split(/\r?\n/).map(x=>({x:x.trim()}))};

function lyPick(list,dur){

 const near=ok.filter(d=>gap(d)<=6).sort((a,b)=>(!!b.syncedLyrics-!!a.syncedLyrics)||(gap(a)-gap(b)));

const ENV=new Map(),vizEls=[...document.querySelectorAll('.viz')],dv=[0,0,0,0,0],DOFF=[-.12,-.06,0,.06,.12],DW=[.75,.92,1,.92,.75];
async function loadEnv(id){
 if(ENV.has(id)||!tracks.has(id))return;
 const C=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!C)return;
 try{
  const raw=await req(st('blobs').get(id));if(!raw||raw.byteLength>25e6)return;
  const buf=await new Promise((res,rej)=>{let c;try{c=new C(1,1,8000)}catch{c=new C(1,1,22050)}const p=c.decodeAudioData(raw.slice(0),res,rej);if(p&&p.catch)p.catch(rej)});
  const hz=20,w=Math.max(1,Math.floor(buf.sampleRate/hz)),n=Math.floor(buf.length/w),chs=[];
  for(let k=0;k<buf.numberOfChannels;k++)chs.push(buf.getChannelData(k));
  const rms=new Float32Array(n);
  for(let i=0;i<n;i++){let sum=0,cnt=0;for(const ch of chs)for(let j=i*w;j<i*w+w;j+=3){const v=ch[j];sum+=v*v;cnt++}rms[i]=Math.sqrt(sum/(cnt||1))}
  if(!n)return;
  const ref=Math.max(Float32Array.from(rms).sort()[Math.floor(n*.95)]||0,.02),out=new Uint8Array(n);
  for(let i=0;i<n;i++)out[i]=Math.round(Math.pow(Math.min(1,Math.max(0,(20*Math.log10(rms[i]/ref+1e-4)+24)/24)),1.4)*255);
  ENV.set(id,out);if(ENV.size>40)ENV.delete(ENV.keys().next().value);
 }catch{}
}
function lvl(t){
 const e=cur&&ENV.get(cur.id);if(!e)return -1;
 const x=Math.max(0,t)*20,i=Math.floor(x);
 if(i>=e.length-1)return (e[e.length-1]||0)/255;
 const f=x-i;return (e[i]*(1-f)+e[i+1]*f)/255;
}

/* ---------- Import / restore ---------- */
async function readZip(buf){
 const u=new Uint8Array(buf),v=new DataView(buf),out=[];
 let e=u.length-22;while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;
 if(e<0)throw new Error('zip');
 const n=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);
 for(let i=0;i<n;i++){
  if(v.getUint32(p,true)!==0x02014b50)throw new Error('zip');
  const meth=v.getUint16(p+10,true),csz=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true);
  const name=new TextDecoder().decode(u.subarray(p+46,p+46+nl));
  p+=46+nl+xl+cl;
  if(name.endsWith('/'))continue;
  const ds=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true);
  out.push({name,meth,get:async()=>{
   const raw=u.subarray(ds,ds+csz);
   if(meth===0)return raw;
   if(meth===8&&window.DecompressionStream){const s=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return new Uint8Array(await new Response(s).arrayBuffer())}
   throw new Error('unsupported');
  }});
 }
 return out;
}
const nk=(t,a)=>(String(t||'')+'|'+String(a||'')).toLowerCase().trim();
async function applyBackup(b){
 let m=0,pl=0;
 const byKey=new Map(),byTA=new Map();
 for(const t of tracks.values()){byKey.set(t.key,t);byTA.set(nk(t.title,t.artist),t)}
 const find=x=>byKey.get(x.key)||byTA.get(nk(x.title,x.artist));
 for(const x of b.tracks||[]){
  const t=find(x);if(!t)continue;
  for(const k of ['title','artist','album','trk','genre','added'])if(x[k]!==undefined&&x[k]!=='')t[k]=x[k];
  t.fav=!!(t.fav||x.fav);t.plays=Math.max(t.plays||0,x.plays||0);t.ms=Math.max(t.ms||0,x.ms||0);t.last=Math.max(t.last||0,x.last||0);
  if(!t.lyrics&&x.lyrics)t.lyrics=x.lyrics;
  await put('tracks',t);m++;
 }
 const lookup=new Map();for(const t of tracks.values())lookup.set(t.title+' — '+t.artist,t);
 for(const x of b.playlists||[]){
  if(!x||!x.name)continue;
  let l=lists.find(y=>y.name===x.name);
  if(!l){l={id:uid(),name:x.name,ids:[],created:Date.now()+lists.length};lists.push(l)}
  for(const sn of x.songs||[]){const t=lookup.get(sn);if(t&&!l.ids.includes(t.id))l.ids.push(t.id)}
  await put('lists',l);pl++;
 }
 const bs=b.stats;
 if(bs&&Array.isArray(bs.hour)&&(bs.ms||0)>S.ms){S.ms=bs.ms;S.hour=bs.hour.slice(0,24);S.days=bs.days||{};ls('stats',S)}
 renderNav();
 return {m,pl};
}
async function importBackup(f){
 const isZip=/\.zip$/i.test(f.name)||f.type==='application/zip';
 let backupJson=null,songs=0,photos=0;
 try{
  if(isZip){
   toast('Reading backup…');
   const ents=await readZip(await f.arrayBuffer());
   const files=[],pics=[];
   for(const en of ents){
    const base=en.name.split('/').pop();
    if(/^cadence-backup.*\.json$/i.test(base))backupJson=JSON.parse(new TextDecoder().decode(await en.get()));
    else if(/^songs\//i.test(en.name))files.push(new File([await en.get()],base,{type:/\.(mp3|m4a|aac|flac|wav|ogg|opus)$/i.test(base)?'':'application/octet-stream'}));
    else if(/^photos\//i.test(en.name))pics.push({base:base.replace(/\.[^.]+$/,''),en});
   }
   const safeN=s=>s.replace(/[\\/:*?"<>|]/g,'_').trim()||'untitled';
   const haveBase=new Set([...tracks.values()].map(t=>`${safeN(t.artist)} - ${safeN(t.title)}`.toLowerCase()));
   const fresh=files.filter(f=>!haveBase.has(f.name.replace(/\.[^.]+$/,'').replace(/ \(\d+\)$/,'').toLowerCase()));
   const before=tracks.size;
   if(fresh.length)await addFiles(fresh);
   songs=tracks.size-before;
   if(pics.length){
    const safe=s=>s.replace(/[\\/:*?"<>|]/g,'_').trim()||'untitled';
    const names=new Map();for(const t of tracks.values())names.set(`${safe(t.artist)} - ${safe(t.title)}`,t);
    for(const pc of pics){
     const t=names.get(pc.base.replace(/ \(\d+\)$/,''));
     if(t&&!t.cover){const d=await pc.en.get();await applyCover(t,d.buffer.slice(d.byteOffset,d.byteOffset+d.byteLength),/png$/i.test(pc.en.name)?'image/png':'image/jpeg');photos++}
    }
   }
  }else backupJson=JSON.parse(await f.text());
  if(!backupJson||backupJson.app!=='cadence')return toast(isZip?'That zip has no Cadence backup in it':'That isn’t a Cadence backup');
  const r=await applyBackup(backupJson);
  render();if(cur)nowUpdate();
  toast(`Restored${songs?` ${songs} song${songs>1?'s':''},`:''} ${r.m} song details, ${r.pl} playlist${r.pl===1?'':'s'}`);
 }catch(e){toast('Couldn’t read that backup')}
}

function spParse(t){

 return m?{type:m[1].toLowerCase(),id:m[2]}:null;
}
const spUrl=x=>`https://open.spotify.com/${x.type}/${x.id}`;
async function spTitle(x){

}
